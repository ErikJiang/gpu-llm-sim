# gpu-sim 主配置
# 用法：cp config.example.yaml config.yaml，按需修改后 make gen && make install
# 注释行以 # 开头；空字段可省略整节

# —— 基础 ——
namespace: gpu-sim
releaseName: fake-gpu-operator

# —— 节点列表 ——
# 相同 gpu{product,count,memoryMiB} 的节点会被合并到同一 nodePool。
# cpu/memory/architecture 模拟真实主机；workload 显式绑定模型和 GPU utilization。
nodes:
  # DeepSeek V4 Pro：8×H200，约 1.1TiB HBM，模拟 HGX H200 节点。
  - name: kwok-h200-01
    cpu: 224
    memory: 2Ti
    architecture: amd64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA H200 141GB HBM3e
      count: 8
      memoryMiB: 144384
      tflopsFP32: 67.0
    workload:
      modelRelease: deepseek-v4-pro
      utilization: 68-92

  # GLM 5.1 BF16：16×GH200，按 8 个 NVL2 风格 arm64 节点展开。
  - name: kwok-gh200-01
    cpu: 144
    memory: 960Gi
    architecture: arm64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA GH200 144GB HBM3e
