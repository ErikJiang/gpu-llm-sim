# Default values for multi-model chart.
# A single instance deploys ONE model (config.model).
# Batch deployment is driven by ../../install.sh looping over models.env.

replicaCount: 1

image:
  repository: ghcr.m.daocloud.io/llm-d/llm-d-inference-sim
  tag: v0.10.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Pod-level annotations: completely overrides any default prometheus.io/* annotations.
# The three keys below are the user-required custom OpenTelemetry/Insight scrape hints.
podAnnotations:
  insight.opentelemetry.io/metric-path: /metrics
  insight.opentelemetry.io/metric-port: "9090"
  insight.opentelemetry.io/metric-scrape: "true"

podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8001
  # Service-level annotations mirror the pod ones so that service-based discovery
  # in OpenTelemetry/Insight also works.
  annotations:
    insight.opentelemetry.io/metric-path: /metrics
    insight.opentelemetry.io/metric-port: "9090"
    insight.opentelemetry.io/metric-scrape: "true"

syntheticMetrics:
  port: 9090
  baseRps: 63
  weight: 20

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# vLLM render sidecar (initContainer) — downloads tokenizer from ModelScope Hub.
# Set VLLM_USE_MODELSCOPE=true in the container env to switch vLLM's model loader
# from HuggingFace to modelscope.cn (faster / no auth for most Chinese models).
vllmRender:
  image: m.daocloud.io/docker.io/vllm/vllm-openai-cpu:v0.21.0
  imagePullPolicy: IfNotPresent
  port: 8082
  # 容器内 ModelScope 缓存路径；当前 chart 不挂持久卷，Pod 重建会重新下载
  modelScopeCache: /root/.cache/modelscope
  # 可设置仓库 tag/commit；master 代表跟随 ModelScope 默认分支。
  modelRevision: master
  # Tokenizer/processor repository; may differ from the served API model name.
  model: "ZhipuAI/GLM-5.2"

config:
  port: 8001
  model: "GLM-5.2"
  servedModelName:
  - "GLM-5.2"
  maxLoras: 2
  maxCpuLoras: 5
  maxNumSeqs: 64
  maxModelLen: 1000000
  maxWaitingQueueLength: 1000
  loraModules: []
  mode: "random"
  latencyCalculator: per-token
  timeToFirstToken: 500
  timeToFirstTokenStdDev: 100
  interTokenLatency: 50
  interTokenLatencyStdDev: 10
  kvCacheTransferLatency: 50
  kvCacheTransferLatencyStdDev: 10
  prefillOverhead: 30ms
  prefillTimePerToken: 250us
  prefillTimeStdDev: 60us
  kvCacheTransferTimePerToken: 3us
  kvCacheTransferTimeStdDev: 0.9us
  timeFactorUnderLoad: "2.0"
  enableKvcache: true
  kvCacheSize: 393216
  globalCacheHitThreshold: "0.35"
  blockSize: 16
  seed: 100100100

# Extra env vars merged into the main container. Use install.sh --set-string env.HF_TOKEN=...
env: {}

# Example:
#   HF_TOKEN: "hf_xxx..."
