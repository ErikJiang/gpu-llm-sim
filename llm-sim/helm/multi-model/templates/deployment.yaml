apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multi-model.fullname" . }}
  labels:
    {{- include "multi-model.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "multi-model.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "multi-model.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      # vLLM render sidecar - handles tokenization via HTTP (vllm launch render).
      # restartPolicy: Always makes this a native sidecar (K8s 1.29+):
      # the simulator will not start until this container's readinessProbe passes.
      # vLLM OpenAI CPU image does not bundle `modelscope`, so we pip install it
      # on first boot. The package is cached on the image's writable layer for the
      # Pod's lifetime (we accept ~30-60s extra cold start).
      - name: vllm-render
        image: {{ .Values.vllmRender.image }}
        imagePullPolicy: {{ .Values.vllmRender.imagePullPolicy }}
        restartPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          # 只下载 tokenizer/processor/config/remote-code（单模型通常 2-30MB），不要权重。
          # `vllm launch render` 用 ModelConfig 校验目录，需要 config.json；
          # Qwen3.5 是多模态模型，还需要 preprocessor config 才能初始化 processor。
          # allow + ignore 双重过滤权重，避免数十 GB 到 TB 级下载和 OOM 风险。
          - >-
            pip install --quiet --no-cache-dir -i https://mirrors.aliyun.com/pypi/simple/ 'modelscope>=1.19.7' 'huggingface_hub>=1.5.0,<2.0' &&
            MODEL_DIR=$(python -c "import os; from modelscope import snapshot_download; print(snapshot_download(os.environ['MODEL_ID'], revision=os.environ['MODEL_REVISION'], allow_file_pattern=['config.json','generation_config.json','tokenizer*','special_tokens_map.json','vocab*','merges.txt','added_tokens.json','preprocessor_config.json','*processor_config.json','chat_template*','*.tiktoken','*.py','*.model','*.txt','*.md'], ignore_file_pattern=['*.safetensors','*.bin','*.gguf','*.pt','*.pth']))" 2>/dev/null || python -c "import os; from modelscope import snapshot_download; print(snapshot_download(os.environ['MODEL_ID'], revision=os.environ['MODEL_REVISION'], allow_file_pattern=['*.json','*.py','*.tiktoken','*.model','*.txt','*.md'], ignore_file_pattern=['*.safetensors','*.bin','*.gguf','*.pt','*.pth']))") &&
            echo "tokenizer ready at $MODEL_DIR" &&
            exec vllm launch render "$MODEL_DIR" --port={{ .Values.vllmRender.port }} --trust-remote-code
        env:
          # 切到 ModelScope Hub：vllm 内部 model loader 改从 modelscope.cn 拉取
          - name: VLLM_USE_MODELSCOPE
            value: "true"
          # ModelScope 缓存路径（容器内）
          - name: MODELSCOPE_CACHE
            value: {{ .Values.vllmRender.modelScopeCache | default "/root/.cache/modelscope" | quote }}
          - name: MODEL_ID
            value: {{ .Values.config.model | quote }}
          - name: MODEL_REVISION
            value: {{ .Values.vllmRender.modelRevision | default "master" | quote }}
          # 兼容旧字段：HF_TOKEN 在 ModelScope 上不强制需要，但保留以便少数 gated 仓库
          - name: HF_TOKEN
            value: {{ .Values.env.HF_TOKEN | default "" | quote }}
        ports:
        - name: http
          containerPort: {{ .Values.vllmRender.port }}
        # vLLM render 不加载权重，但大词表与 remote-code 初始化需要保留内存余量。
        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.vllmRender.port }}
          initialDelaySeconds: 300
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.vllmRender.port }}
          initialDelaySeconds: 180
          periodSeconds: 10
          failureThreshold: 5
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /config/config.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: {{ include "multi-model.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
