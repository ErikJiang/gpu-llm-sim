# gpu-sim 主配置
# 用法：cp config.example.yaml config.yaml，按需修改后 make gen && make install
# 注释行以 # 开头；空字段可省略整节

# —— 基础 ——
namespace: gpu-sim
releaseName: fake-gpu-operator

# —— 节点列表 ——
# 相同 gpu{product,count,memoryMiB} 的节点会被合并到同一 nodePool。
# cpu/memory/architecture 模拟真实主机；workload 显式绑定模型和 GPU utilization。
nodes:
  # DeepSeek-V4-Pro：6 个 HGX H200 节点，共 48 卡。
  - name: kwok-h200
    replicas: 6
    cpu: 224
    memory: 2Ti
    architecture: amd64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA H200 141GB HBM3e
      count: 8
      memoryMiB: 144384
      tflopsFP32: 67.0
    workload:
      modelRelease: deepseek-v4-pro
      utilization: 68-92

  # GLM-5.2：40 个 GH200 NVL2 风格 arm64 节点，共 80 卡。
  - name: kwok-gh200
    replicas: 40
    cpu: 144
    memory: 960Gi
    architecture: arm64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA GH200 144GB HBM3e
      count: 2
      memoryMiB: 147456
      tflopsFP32: 60.0
    workload:
      modelRelease: glm-52
      utilization: 58-88

  # 三个 H100 服务池，共 44 卡。
  - name: kwok-h100
    replicas: 4
    cpu: 128
    memory: 1Ti
    architecture: amd64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA H100 80GB HBM3
      count: 4
      memoryMiB: 81920
      tflopsFP32: 67.0
    workload:
      modelRelease: minimax-m3
      utilization: 66-91

  - name: kwok-h100-kimi
    replicas: 4
    cpu: 128
    memory: 1Ti
    architecture: amd64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA H100 80GB HBM3
      count: 4
      memoryMiB: 81920
      tflopsFP32: 67.0
    workload:
      modelRelease: kimi-k27-code
      utilization: 64-90

  - name: kwok-h100-qwen
    replicas: 3
    cpu: 128
    memory: 1Ti
    architecture: amd64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA H100 80GB HBM3
      count: 4
      memoryMiB: 81920
      tflopsFP32: 67.0
    workload:
      modelRelease: qwen37-plus
      utilization: 70-94

  # 旧卡保留为可见的 idle capacity，不伪装承载前沿模型。
  - name: kwok-a100-pcie
    replicas: 5
    cpu: 64
    memory: 512Gi
    architecture: amd64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA A100-PCIE-80GB
      count: 2
      memoryMiB: 81920
      tflopsFP32: 19.5

  - name: kwok-v100-sxm2
    replicas: 5
    cpu: 48
    memory: 256Gi
    architecture: amd64
    taints:
      - key: kwok.x-k8s.io/node
        value: fake
        effect: NoSchedule
    gpu:
      product: NVIDIA V100-SXM2-32GB
      count: 2
      memoryMiB: 32768
      tflopsFP32: 15.7

# —— 加速器（可选） ——
# 全部字段都可省略，省略后走默认上游。
# 内置 daocloud 镜像便于国内环境；可整体覆盖或追加。
accelerator:
  # 容器镜像仓库替换表
  # 规则：按 source 字段做最长前缀匹配；命中则整段前缀替换为 target
  # 影响范围：生成的 values.yaml 中所有 *.image.repository 字段
  imageRegistryMap:
    - source: ghcr.io
      target: ghcr.m.daocloud.io
    - source: docker.io
      target: docker.m.daocloud.io
    - source: k8s.gcr.io
      target: k8s-gcr.m.daocloud.io
    - source: registry.k8s.io
      target: k8s-gcr.m.daocloud.io

  # Helm OCI 仓库替换（用于拉 fake-gpu-operator chart）
  # 留空：走 Chart.yaml 默认的 oci://ghcr.io/run-ai/fake-gpu-operator
  # 配后：install.sh 会用 `helm pull` 从该 URL 拉取 chart，跳过 `helm dependency update`
  # 注意：daocloud 镜像的 OCI 仓库白名单不含 run-ai/fake-gpu-operator，留空走上游更稳
  helmOCIRepository: ""

  # KWOK manifest 下载基址
  # 留空：走官方 https://github.com/kubernetes-sigs/kwok/releases/download
  # 用于下载 kwok.yaml 和 stage-fast.yaml
  kwokBaseURL: https://files.m.daocloud.io/github.com/kubernetes-sigs/kwok/releases/download

  # KWOK 版本（任意 release tag）
  kwokVersion: v0.7.0
