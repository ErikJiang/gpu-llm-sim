# shadow-pod.template.yaml
# One Pod per KWOK node, requesting all configured GPUs on that node.
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-load-{{NODE_NAME}}
  namespace: {{WORKLOAD_NAMESPACE}}
  labels:
    app: gpu-sim-shadow
    run.ai/simulated-gpu-node-pool: {{POOL_NAME}}
    gpu-llm-sim/release: {{MODEL_RELEASE}}
    gpu-llm-sim/node: {{NODE_NAME}}
    gpu-llm-sim/gpu-count: "{{GPU_REQUEST}}"
  annotations:
    run.ai/simulated-gpu-utilization: "{{WORKLOAD_UTIL}}"
    run.ai/simulated-gpu-memory: "{{WORKLOAD_MEM_USED}}"
    gpu-llm-sim/model: "{{MODEL_NAME}}"
spec:
  restartPolicy: Never
  nodeName: {{NODE_NAME}}
  tolerations:
  - key: kwok.x-k8s.io/node
    value: fake
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  containers:
  - name: pause
    image: {{WORKLOAD_IMAGE}}
    resources:
      limits:
        nvidia.com/gpu: {{GPU_REQUEST}}
    command: [ "sh", "-c", "echo gpu-sim shadow {{MODEL_RELEASE}} on {{NODE_NAME}} gpus {{GPU_REQUEST}} && sleep 86400" ]
